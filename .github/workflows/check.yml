name: Check

# Every entry against its schema and the rules a schema cannot say, and the tests for those rules.
# What a pull request has to pass before a maintainer reads it.
on:
    pull_request:
    push:
        branches:
            - main

permissions:
    contents: read

jobs:
    check:
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version: 26
                  cache: npm

            - name: Install
              run: npm ci

            - name: Test
              run: npm test

            - name: Check the entries
              run: npm run check

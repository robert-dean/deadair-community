name: Submit

# Turns a submission issue into a one-file pull request, or answers it with what has to change.
#
# This runs on text anybody with a GitHub account can write, with a token that can push a branch and
# open a pull request, so three rules hold throughout:
#
# - The issue is read by scripts/submission.run.mjs from the event payload on disk. No expression here
#   puts any of its text into a shell; the steps below see only the path the script built from a
#   checked slug, the issue's number and its author's login, and see them through `env`.
# - The workflow that runs is always the one on main: an `issues` event never runs a workflow from a
#   fork or a branch, so a submission cannot change what judges it.
# - Nothing merges. The bot's branch is a proposal a maintainer reads.
#
# The branch, the pull request and the comments are made as a GitHub App, not with the workflow's
# own token: GitHub starts no workflow for a push or a pull request made with that token, so a
# submission's pull request was never checked. The App needs Contents, Pull requests and Issues (read
# and write) on this repository. Its client ID is the SUBMIT_APP_CLIENT_ID variable, and its private
# key the SUBMIT_APP_PRIVATE_KEY secret.
on:
    issues:
        types: [opened, edited, reopened]

permissions: {}

# An edit made while an earlier run is still going supersedes it.
concurrency:
    group: submission-${{ github.event.issue.number }}
    cancel-in-progress: true

jobs:
    submit:
        if: >-
            github.event.issue.state == 'open' && (
            contains(github.event.issue.labels.*.name, 'add-station') ||
            contains(github.event.issue.labels.*.name, 'add-plugin') ||
            contains(github.event.issue.labels.*.name, 'add-persona') ||
            contains(github.event.issue.labels.*.name, 'add-language') ||
            contains(github.event.issue.labels.*.name, 'add-app'))
        runs-on: ubuntu-latest
        timeout-minutes: 10

        permissions:
            contents: read

        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  ref: main
                  persist-credentials: false

            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version: 26
                  cache: npm

            - name: Install
              run: npm ci

            - name: Turn the issue into an entry
              id: entry
              run: node scripts/submission.run.mjs

            # After the script, so nothing the issue says runs while the token exists.
            - name: Get the App's token
              id: app
              uses: actions/create-github-app-token@v3
              with:
                  client-id: ${{ vars.SUBMIT_APP_CLIENT_ID }}
                  private-key: ${{ secrets.SUBMIT_APP_PRIVATE_KEY }}
                  permission-contents: write
                  permission-pull-requests: write
                  permission-issues: write

            - name: Say what has to change
              if: steps.entry.outputs.ok != 'true'
              run: cp "$RUNNER_TEMP/submission.md" "$RUNNER_TEMP/status.md"

            # One branch per issue, rewritten on every edit, so the pull request always shows the entry
            # as the issue now describes it.
            - name: Open or update the pull request
              if: steps.entry.outputs.ok == 'true'
              env:
                  GH_TOKEN: ${{ steps.app.outputs.token }}
                  APP: ${{ steps.app.outputs.app-slug }}
                  ISSUE: ${{ github.event.issue.number }}
                  AUTHOR: ${{ github.event.issue.user.login }}
                  ENTRY: ${{ steps.entry.outputs.path }}
              run: |
                  branch="submission/$ISSUE"
                  bot="${APP}[bot]"
                  git config user.name "$bot"
                  git config user.email "$(gh api "/users/$bot" --jq .id)+$bot@users.noreply.github.com"
                  git switch -c "$branch"
                  git add -- "$ENTRY"
                  git commit -m "Add $ENTRY" -m "Submitted by @$AUTHOR in #$ISSUE."
                  git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$branch"

                  existing="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --state open --json number --jq '.[0].number')"
                  if [ -n "$existing" ]; then
                      gh pr edit "$existing" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/submission.md"
                      echo "Updated #$existing from the issue as it now stands." > "$RUNNER_TEMP/status.md"
                  else
                      created="$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" --title "Add $ENTRY" --body-file "$RUNNER_TEMP/submission.md")"
                      echo "Opened #${created##*/} for a maintainer to read." > "$RUNNER_TEMP/status.md"
                  fi

            # One comment per issue, edited by every later run, so an issue edited five times carries one
            # answer, and it is the current one. The marker is how a run finds it again: the bot's other
            # comments, if a maintainer ever has it write any, are left alone.
            - name: Answer on the issue
              env:
                  GH_TOKEN: ${{ steps.app.outputs.token }}
                  APP: ${{ steps.app.outputs.app-slug }}
                  ISSUE: ${{ github.event.issue.number }}
              run: |
                  marker='<!-- deadair-submission-status -->'
                  { echo "$marker"; cat "$RUNNER_TEMP/status.md"; } > "$RUNNER_TEMP/comment.md"
                  comment="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$ISSUE/comments" \
                      | jq -r --arg bot "${APP}[bot]" --arg marker "$marker" '.[] | select(.user.login == $bot and (.body | startswith($marker))) | .id' \
                      | head -n 1)"
                  if [ -n "$comment" ]; then
                      gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment" -F "body=@$RUNNER_TEMP/comment.md" --silent
                  else
                      gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/comment.md"
                  fi
